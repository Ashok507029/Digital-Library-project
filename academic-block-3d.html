<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
    }

    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* ── Top Header Navigation ─────────────────────────────────────────── */
    .top-bar {
      position: absolute;
      top: 20px;
      left: 20px;
      right: 20px;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }

    .top-bar * {
      pointer-events: auto;
    }

    .brand-card {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 14px;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .brand-title {
      color: #ffffff;
      margin: 0;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .brand-sub {
      color: #38bdf8;
      font-size: 12px;
      font-weight: 600;
    }

    .nav-actions {
      display: flex;
      gap: 10px;
    }

    .btn-glass {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      padding: 10px 16px;
      border-radius: 10px;
      cursor: pointer;
      text-decoration: none;
      font-weight: 600;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
    }

    .btn-glass:hover {
      background: #1e293b;
      border-color: #38bdf8;
      color: #38bdf8;
      transform: translateY(-2px);
    }

    /* ── Bottom Controls Info ──────────────────────────────────────────── */
    .bottom-info-pill {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      padding: 9px 24px;
      font-size: 13px;
      color: #e2e8f0;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
      pointer-events: none;
    }

    /* ── Detail Navigation Modal Drawer ───────────────────────────────── */
    .wing-modal {
      position: absolute;
      bottom: 75px;
      right: 24px;
      z-index: 20;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      padding: 20px;
      width: 340px;
      color: #ffffff;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      display: none;
    }

    .modal-title {
      font-size: 16px;
      font-weight: 700;
      color: #facc15;
      margin-bottom: 4px;
    }

    .modal-sub {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 12px;
    }

    .floor-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 240px;
      overflow-y: auto;
    }

    .floor-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 10px 14px;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .floor-card:hover {
      background: rgba(56, 189, 248, 0.15);
      border-color: #38bdf8;
    }

    .modal-close {
      position: absolute;
      top: 14px;
      right: 14px;
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 18px;
      cursor: pointer;
    }

    .modal-close:hover {
      color: #ffffff;
    }
  </style>
</head>

    // ── Procedural Textures & Assets (1:1 Match to Real VGU Reference Photo) ────
    function createVivekanandaTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512; canvas.height = 640;
      const ctx = canvas.getContext('2d');

      // Real Photo Backdrop: Dark Crimson Maroon Studio Gradient
      const bgGrad = ctx.createLinearGradient(0, 0, 0, 640);
      bgGrad.addColorStop(0, '#6b1717');
      bgGrad.addColorStop(0.5, '#4a0e0e');
      bgGrad.addColorStop(1, '#2b0808');
      ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, 512, 640);

      // Gold Beveled Inner Frame (Matching Photo 2!)
      ctx.strokeStyle = '#d97706'; ctx.lineWidth = 14;
      ctx.strokeRect(8, 8, 496, 624);
      ctx.strokeStyle = '#fef08a'; ctx.lineWidth = 3;
      ctx.strokeRect(15, 15, 482, 610);

      // Swami Vivekananda Torso - Dark Red/Maroon Sweater (Exact Photo Match!)
      ctx.fillStyle = '#7f1d1d';
      ctx.beginPath();
      ctx.moveTo(70, 640);
      ctx.quadraticCurveTo(90, 360, 150, 310);
      ctx.quadraticCurveTo(256, 290, 362, 310);
      ctx.quadraticCurveTo(422, 360, 442, 640);
      ctx.closePath(); ctx.fill();

      // Folded Arms Gesture (Crossed arms in front of chest)
      ctx.fillStyle = '#991b1b';
      ctx.beginPath();
      ctx.ellipse(256, 430, 150, 52, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#450a0a'; ctx.lineWidth = 4; ctx.stroke();

      // Saffron Collar / Under-robe peeking at neck
      ctx.fillStyle = '#ea580c';
      ctx.beginPath();
      ctx.moveTo(215, 295); ctx.lineTo(256, 325); ctx.lineTo(297, 295); ctx.lineTo(256, 265);
      ctx.closePath(); ctx.fill();

      // Neck
      ctx.fillStyle = '#c67d5a';
      ctx.fillRect(225, 215, 62, 70);

      // Realistic Face Features
      ctx.fillStyle = '#d98a6c';
      ctx.beginPath();
      ctx.ellipse(260, 170, 64, 78, 0.04, 0, Math.PI * 2); ctx.fill();

      // Eyebrows
      ctx.fillStyle = '#1c1917';
      ctx.beginPath(); ctx.ellipse(228, 150, 15, 4, -0.1, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(292, 150, 15, 4, 0.1, 0, Math.PI * 2); ctx.fill();

      // Eyes
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.ellipse(228, 163, 11, 6, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(292, 163, 11, 6, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#0c0a09';
      ctx.beginPath(); ctx.arc(230, 163, 5, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(294, 163, 5, 0, Math.PI * 2); ctx.fill();

      // Nose & Mustache
      ctx.strokeStyle = '#854d0e'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(260, 155); ctx.lineTo(258, 188); ctx.lineTo(268, 190); ctx.stroke();

      ctx.fillStyle = '#1c1917';
      ctx.beginPath(); ctx.ellipse(260, 203, 22, 5, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#991b1b';
      ctx.beginPath(); ctx.ellipse(260, 210, 11, 3, 0, 0, Math.PI * 2); ctx.fill();

      // Iconic Saffron Turban (Pagri) - Exact photo shape!
      ctx.fillStyle = '#ea580c';
      ctx.beginPath(); ctx.ellipse(260, 105, 82, 38, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#f97316';
      ctx.beginPath(); ctx.ellipse(260, 93, 86, 30, -0.08, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#c2410c';
      ctx.beginPath(); ctx.ellipse(260, 83, 74, 22, 0.08, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fdba74';
      ctx.beginPath(); ctx.ellipse(205, 80, 24, 36, -0.3, 0, Math.PI * 2); ctx.fill();

      const texture = new THREE.CanvasTexture(canvas);
      return texture;
    }

    function createBeigeVguBandTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 1024; canvas.height = 256;
      const ctx = canvas.getContext('2d');

      // Sand Beige Tile Wall Background (Matching Photo 2!)
      ctx.fillStyle = '#ded3c3'; ctx.fillRect(0, 0, 1024, 256);

      // Tile Grid Lines
      ctx.strokeStyle = '#c4b5a2'; ctx.lineWidth = 3;
      const colW = 1024 / 8;
      for (let x = colW; x < 1024; x += colW) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 256); ctx.stroke();
      }
      ctx.beginPath(); ctx.moveTo(0, 128); ctx.lineTo(1024, 128); ctx.stroke();

      // Bold Crimson Red VGU Logo Centered (Matching Photo 2!)
      ctx.font = '900 130px Arial, Helvetica, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#b91c1c';
      ctx.fillText('VGU', 512, 128);

      return new THREE.CanvasTexture(canvas);
    }

    function createGlassDoorWith4SealsTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 1024; canvas.height = 512;
      const ctx = canvas.getContext('2d');

      // Clear Tinted Glass Background
      ctx.fillStyle = 'rgba(15, 23, 42, 0.4)';
      ctx.fillRect(0, 0, 1024, 512);

      // Diagonal Specular Reflection
      const reflectGrad = ctx.createLinearGradient(0, 0, 1024, 512);
      reflectGrad.addColorStop(0, 'rgba(255, 255, 255, 0.3)');
      reflectGrad.addColorStop(0.35, 'rgba(255, 255, 255, 0.05)');
      reflectGrad.addColorStop(0.7, 'rgba(255, 255, 255, 0.25)');
      reflectGrad.addColorStop(1, 'rgba(255, 255, 255, 0.05)');
      ctx.fillStyle = reflectGrad; ctx.fillRect(0, 0, 1024, 512);

      // 4 Glass Door Panel Boundaries
      ctx.strokeStyle = '#475569'; ctx.lineWidth = 5;
      ctx.strokeRect(4, 4, 1016, 504);

      const panelW = 1024 / 4;
      for (let i = 1; i < 4; i++) {
        ctx.beginPath(); ctx.moveTo(i * panelW, 4); ctx.lineTo(i * panelW, 508); ctx.stroke();
      }

      // Center Door Split Gap Line
      ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 8;
      ctx.beginPath(); ctx.moveTo(512, 4); ctx.lineTo(512, 508); ctx.stroke();

      // 4 CIRCULAR STICKERS / SEALS (Exact 1:1 match to real photo!)
      [0.5, 1.5, 2.5, 3.5].forEach(panelIdx => {
        const cx = panelIdx * panelW;
        const cy = 260;
        const radius = 48;

        // Circular White Sticker Base
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(cx, cy, radius, 0, Math.PI * 2); ctx.fill();

        // Outer Crimson Ring
        ctx.strokeStyle = '#b91c1c'; ctx.lineWidth = 5;
        ctx.beginPath(); ctx.arc(cx, cy, radius - 3, 0, Math.PI * 2); ctx.stroke();

        // Inner Vivekananda Graphic Profile
        ctx.fillStyle = '#ea580c';
        ctx.beginPath(); ctx.arc(cx, cy - 6, 18, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#b91c1c';
        ctx.beginPath(); ctx.ellipse(cx, cy + 16, 24, 11, 0, 0, Math.PI * 2); ctx.fill();

        // Text "VGU JAIPUR"
        ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillStyle = '#b91c1c';
        ctx.fillText('VGU', cx, cy + 32);
      });

      // Stainless Steel Handles S-Curve in center split (Exact photo match!)
      ctx.strokeStyle = '#f1f5f9'; ctx.lineWidth = 7;
      ctx.beginPath(); ctx.arc(495, 330, 40, Math.PI * 0.75, Math.PI * 1.25); ctx.stroke();
      ctx.beginPath(); ctx.arc(529, 330, 40, -Math.PI * 0.25, Math.PI * 0.25); ctx.stroke();

      // Top Glass Text Banner
      ctx.font = 'bold 15px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
      ctx.fillText('MILLION DREAMS  |  BILLION STORIES  |  ONE UNIVERSITY', 512, 55);

      return new THREE.CanvasTexture(canvas);
    }

      // Dark Stainless Steel Door Frame & Middle Split Line (Double Automatic Sliding Doors)
      ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 16;
      ctx.strokeRect(8, 8, 496, 496);

      // Center Door Split Gap Line
      ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 8;
      ctx.beginPath(); ctx.moveTo(256, 8); ctx.lineTo(256, 504); ctx.stroke();

      // Stainless Steel Vertical Door Handles
      ctx.fillStyle = '#e2e8f0';
      ctx.fillRect(238, 180, 10, 160);
      ctx.fillRect(264, 180, 10, 160);
      ctx.fillStyle = '#64748b';
      ctx.fillRect(240, 182, 6, 156);
      ctx.fillRect(266, 182, 6, 156);

      // Stainless Steel Bottom Kickplates / Base Rails
      ctx.fillStyle = '#334155'; ctx.fillRect(16, 460, 480, 40);
      ctx.fillStyle = '#94a3b8'; ctx.fillRect(16, 460, 480, 6);

      // Circular VGU Emblem Etched on Glass Center
      ctx.fillStyle = 'rgba(254, 243, 199, 0.85)';
      ctx.beginPath(); ctx.arc(256, 130, 65, 0, Math.PI * 2); ctx.fill();

      ctx.strokeStyle = '#991b1b'; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.arc(256, 130, 58, 0, Math.PI * 2); ctx.stroke();

      ctx.font = 'bold 24px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = '#991b1b';
      ctx.fillText('VGU', 256, 120);
      ctx.font = 'bold 12px sans-serif';
      ctx.fillText('JAIPUR', 256, 142);

      return new THREE.CanvasTexture(canvas);
    }

    function createRedBrickDrivewayTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512; canvas.height = 512;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#881337'; ctx.fillRect(0, 0, 512, 512);

      const rows = 32, cols = 16;
      const rh = 512 / rows, cw = 512 / cols;

      for (let r = 0; r < rows; r++) {
        const offset = (r % 2) * (cw / 2);
        for (let c = -1; c <= cols; c++) {
          const x = c * cw + offset, y = r * rh;
          const noise = (Math.random() - 0.5) * 30;
          const rCol = Math.min(180, Math.max(120, 153 + noise));
          const gCol = Math.min(50, Math.max(10, 27 + noise));
          const bCol = Math.min(60, Math.max(15, 36 + noise));

          ctx.fillStyle = `rgb(${Math.floor(rCol)},${Math.floor(gCol)},${Math.floor(bCol)})`;
          ctx.fillRect(x + 1, y + 1, cw - 2, rh - 2);
        }
      }

      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      texture.repeat.set(6, 6);
      return texture;
    }

    function createDetailedCar(bodyColorHex, roofColorHex = 0x0f172a, isSUV = false) {
      const carGroup = new THREE.Group();

      const bodyMat = new THREE.MeshStandardMaterial({ color: bodyColorHex, roughness: 0.2, metalness: 0.7 });
      const roofMat = new THREE.MeshStandardMaterial({ color: roofColorHex, roughness: 0.15, metalness: 0.8 });
      const wheelMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8 });
      const rimMat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, roughness: 0.2, metalness: 0.9 });
      const glassMatCar = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.05, metalness: 0.9, transparent: true, opacity: 0.85 });
      const lightMat = new THREE.MeshStandardMaterial({ color: 0xfef08a, emissive: 0xfef08a, emissiveIntensity: 0.8 });
      const tailMat = new THREE.MeshStandardMaterial({ color: 0xef4444, emissive: 0xef4444, emissiveIntensity: 0.6 });

      const w = 2.0, l = isSUV ? 4.5 : 4.1, h = isSUV ? 1.0 : 0.8;

      const body = new THREE.Mesh(new THREE.BoxGeometry(w, h, l), bodyMat);
      body.position.y = h / 2 + 0.35; body.castShadow = true; carGroup.add(body);

      const cabL = isSUV ? 2.6 : 2.2;
      const cabH = isSUV ? 0.9 : 0.75;
      const cabin = new THREE.Mesh(new THREE.BoxGeometry(w - 0.15, cabH, cabL), roofMat);
      cabin.position.set(0, h + cabH / 2 + 0.3, -0.2); cabin.castShadow = true; carGroup.add(cabin);

      const windshield = new THREE.Mesh(new THREE.BoxGeometry(w - 0.2, cabH - 0.1, 0.1), glassMatCar);
      windshield.position.set(0, h + cabH / 2 + 0.3, cabL / 2 - 0.2);
      windshield.rotation.x = -0.35; carGroup.add(windshield);

      const rearGlass = new THREE.Mesh(new THREE.BoxGeometry(w - 0.2, cabH - 0.1, 0.1), glassMatCar);
      rearGlass.position.set(0, h + cabH / 2 + 0.3, -cabL / 2 - 0.2);
      rearGlass.rotation.x = 0.35; carGroup.add(rearGlass);

      [-0.7, 0.7].forEach(hx => {
        const headLight = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.15, 0.1), lightMat);
        headLight.position.set(hx, h + 0.1, l / 2 + 0.01); carGroup.add(headLight);

        const tailLight = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.15, 0.1), tailMat);
        tailLight.position.set(hx, h + 0.1, -l / 2 - 0.01); carGroup.add(tailLight);
      });

      [
        [-w / 2 - 0.05, 0.35, l / 2 - 0.9],

    function createBrickTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512; canvas.height = 512;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#b79766'; ctx.fillRect(0, 0, 512, 512);

      const rows = 32, cols = 16;
      const rh = 512 / rows, cw = 512 / cols;

      for (let r = 0; r < rows; r++) {
        const offset = (r % 2) * (cw / 2);
        for (let c = -1; c <= cols; c++) {
          const x = c * cw + offset, y = r * rh;
          const noise = (Math.random() - 0.5) * 25;
          const rCol = Math.min(235, Math.max(160, 207 + noise));
          const gCol = Math.min(195, Math.max(120, 168 + noise));
          const bCol = Math.min(120, Math.max(60, 94 + noise));

          ctx.fillStyle = `rgb(${Math.floor(rCol)},${Math.floor(gCol)},${Math.floor(bCol)})`;
          ctx.fillRect(x + 1, y + 1, cw - 2, rh - 2);

          for(let n=0; n<15; n++){
            ctx.fillStyle = `rgba(0,0,0,${Math.random() * 0.12})`;
            ctx.fillRect(x + Math.random()*cw, y + Math.random()*rh, 2, 2);
          }
        }
      }

      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      texture.repeat.set(4, 4);
      return texture;
    }

    function createConcreteTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 256; canvas.height = 256;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#f1f5f9'; ctx.fillRect(0, 0, 256, 256);

      for (let i = 0; i < 4000; i++) {
        const x = Math.random() * 256, y = Math.random() * 256;
        const val = Math.random() * 0.08;
        ctx.fillStyle = Math.random() > 0.5 ? `rgba(0,0,0,${val})` : `rgba(255,255,255,${val})`;
        ctx.fillRect(x, y, 2, 2);
      }

      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      texture.repeat.set(6, 6);
      return texture;
    }

    function createGrassTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512; canvas.height = 512;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#3f7023'; ctx.fillRect(0, 0, 512, 512);

      for (let i = 0; i < 20000; i++) {
        const x = Math.random() * 512, y = Math.random() * 512;
        const h = 4 + Math.random() * 6;
        const gCol = 80 + Math.random() * 70;
        ctx.strokeStyle = `rgb(40, ${Math.floor(gCol)}, 20)`;
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + (Math.random() - 0.5) * 2, y - h); ctx.stroke();
      }

      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      texture.repeat.set(8, 8);
      return texture;
    }

    function createAsphaltTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 256; canvas.height = 256;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#2b3442'; ctx.fillRect(0, 0, 256, 256);

      for (let i = 0; i < 3000; i++) {
        const x = Math.random() * 256, y = Math.random() * 256;
        const c = Math.random() > 0.5 ? 255 : 0;
        ctx.fillStyle = `rgba(${c},${c},${c},${Math.random() * 0.15})`;
        ctx.fillRect(x, y, 1.5, 1.5);
      }

      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      texture.repeat.set(10, 10);
      return texture;
    }

    function createPaverTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 256; canvas.height = 256;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#cbd5e1'; ctx.fillRect(0, 0, 256, 256);

      ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 3;
      const tileSize = 32;
      for (let x = 0; x <= 256; x += tileSize) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 256); ctx.stroke();
      }
      for (let y = 0; y <= 256; y += tileSize) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(256, y); ctx.stroke();
      }

      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      texture.repeat.set(6, 6);
      return texture;
    }

          }

          // Front Windows
          for (let wx = -extW / 2 + 2.5; wx <= extW / 2 - 2.5; wx += 4.5) {
            const winFront = new THREE.Mesh(new THREE.BoxGeometry(2.0, 2.6, 0.1), glassMat);
            winFront.position.set(wx, wy, extD / 2 + 0.08);
            extGroup.add(winFront);
          }
        }

        // Vertical White Columns on Front Facade
        [-extW / 2 + 1.2, 0, extW / 2 - 1.2].forEach(colX => {
          const colF = new THREE.Mesh(new THREE.BoxGeometry(0.8, extH + 0.2, 0.6), whiteMat);
          colF.position.set(colX, extH / 2, extD / 2 + 0.05); colF.castShadow = true; extGroup.add(colF);
        });

        extGroup.position.set(x, 0, 60); // Centered at Z = 60 (Spans Z = 45 to Z = 75!)
        scene.add(extGroup);
      }

      createFrontExtensionStructure(-76); // Left Wing Front Extension Structure
      createFrontExtensionStructure(76);  // Right Wing Front Extension Structure

      // 12. ELEVATED CONNECTING GALLERY BRIDGES (Connecting Side Extensions to Front Center Block)
      function createElevatedGalleryBridge(x, y = 8.5, z = 51, widthX = 35, depthZ = 16.0, bridgeHeight = 18.7) {
        const bridgeGroup = new THREE.Group();
        const bridgeMat = new THREE.MeshStandardMaterial({ color: 0x1c1917, roughness: 0.7 });
        const glassBridgeMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.1, metalness: 0.9, transparent: true, opacity: 0.9 });

        // Elevated Base Floor Slab at Y = 8.5
        const floorSlab = new THREE.Mesh(new THREE.BoxGeometry(widthX, 0.8, depthZ), whiteMat);
        floorSlab.position.set(0, y, 0); floorSlab.castShadow = true; bridgeGroup.add(floorSlab);

        // Main Bridge Facade
        const body = new THREE.Mesh(new THREE.BoxGeometry(widthX, bridgeHeight, depthZ), bridgeMat);
        body.position.set(0, y + bridgeHeight / 2, 0); body.castShadow = true; bridgeGroup.add(body);

        // Roof Cornice
        const roofSlab = new THREE.Mesh(new THREE.BoxGeometry(widthX + 0.8, 0.8, depthZ + 0.8), whiteMat);
        roofSlab.position.set(0, y + bridgeHeight + 0.4, 0); roofSlab.castShadow = true; bridgeGroup.add(roofSlab);

        // EXACTLY 4 GALLERY CORRIDOR LEVELS (Floors 2, 3, 4, 5)
        const floorsCount = 4;
        for (let f = 0; f < floorsCount; f++) {
          const wy = y + 2.2 + f * 4.3;
          const glassFront = new THREE.Mesh(new THREE.BoxGeometry(widthX - 0.8, 2.6, 0.15), glassBridgeMat);
          glassFront.position.set(0, wy, depthZ / 2 + 0.08); bridgeGroup.add(glassFront);

          const glassBack = new THREE.Mesh(new THREE.BoxGeometry(widthX - 0.8, 2.6, 0.15), glassBridgeMat);
          glassBack.position.set(0, wy, -depthZ / 2 - 0.08); bridgeGroup.add(glassBack);
        }

        // Support Columns Underneath (Positioned deeper inside the garden lawn area, clear of curb & road!)
        const gardenCornerX = 7.5; // Shifted deeper into garden lawn (clear of yellow/black curb)
        [-gardenCornerX, gardenCornerX].forEach(cx => {
          [-depthZ / 2 + 1.0, depthZ / 2 - 1.0].forEach(cz => {
            const col = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.7, y, 16), whiteMat);
            col.position.set(cx, y / 2, cz); col.castShadow = true; bridgeGroup.add(col);
          });
        });

        bridgeGroup.position.set(x, 0, z);
        scene.add(bridgeGroup);
      }

      // Connecting Gallery Bridges (Front Left & Right elevated connectors)
      createElevatedGalleryBridge(-53.5, 8.5, 55, 35, 16.0, 18.7);  // Left Front Gallery Connector
      createElevatedGalleryBridge(53.5, 8.5, 55, 35, 16.0, 18.7);   // Right Front Gallery Connector

      // 🏛️ FULL SOLID 7-STORY REAR CORNER BUILDING BLOCKS (Fills ground & upper gap with same 7-story building design!)
      function createSolidCornerBuildingBlock(centerX, centerZ, blockWidth, blockDepth) {
        const blockGroup = new THREE.Group();
        const blockH = 32;

        // Solid Body
        const body = new THREE.Mesh(new THREE.BoxGeometry(blockWidth, blockH, blockDepth), ochreMat);
        body.position.set(0, blockH / 2, 0); body.castShadow = true; body.receiveShadow = true;
        blockGroup.add(body);

        // White Roof Cornice & Roof HVAC details
        const cornice = new THREE.Mesh(new THREE.BoxGeometry(blockWidth + 1.2, 0.8, blockDepth + 1.2), whiteMat);
        cornice.position.set(0, blockH + 0.4, 0); cornice.castShadow = true; blockGroup.add(cornice);
        addRoofDetails(blockGroup, blockWidth, blockDepth, blockH + 0.8);

        // 7 Window Floors & Vertical White Column Fins on Facades
        for (let floor = 0; floor < 7; floor++) {
          const wy = 3.2 + floor * 4.3;
          for (let wx = -blockWidth / 2 + 2.5; wx <= blockWidth / 2 - 2.5; wx += 4.2) {
            const winF = new THREE.Mesh(new THREE.BoxGeometry(1.8, 2.6, 0.1), glassMat);
            winF.position.set(wx, wy, blockDepth / 2 + 0.08); blockGroup.add(winF);

            const winB = new THREE.Mesh(new THREE.BoxGeometry(1.8, 2.6, 0.1), glassMat);
            winB.position.set(wx, wy, -blockDepth / 2 - 0.08); blockGroup.add(winB);
          }
        }

        // Vertical White Fins on Front/Back
        for (let fx = -blockWidth / 2 + 1.5; fx <= blockWidth / 2 - 1.5; fx += 5.5) {
          const finF = new THREE.Mesh(new THREE.BoxGeometry(0.8, blockH + 0.2, 0.6), whiteMat);
          finF.position.set(fx, blockH / 2, blockDepth / 2 + 0.05); finF.castShadow = true; blockGroup.add(finF);

          const finB = new THREE.Mesh(new THREE.BoxGeometry(0.8, blockH + 0.2, 0.6), whiteMat);
          finB.position.set(fx, blockH / 2, -blockDepth / 2 - 0.05); finB.castShadow = true; blockGroup.add(finB);
        }

        blockGroup.position.set(centerX, 0, centerZ);
        scene.add(blockGroup);
      }

      // Solid 7-Story Rear Connecting Blocks (Completely filling the gaps!)
      createSolidCornerBuildingBlock(-62.0, -44.0, 28, 28); // Rear-Left Solid 7-Story Junction Block
      createSolidCornerBuildingBlock(62.0, -44.0, 28, 28);  // Rear-Right Solid 7-Story Junction Block

      // 13. 90-DEGREE CORNER TOWERS WITH CAPS & FRONT WINDOW FACADES
      const cornerGeo = new THREE.BoxGeometry(28, 32, 28);
      [
        [-76, 16, -44], [76, 16, -44], [-76, 16, 75], [76, 16, 75]
      ].forEach(([cx, cy, cz]) => {
        const cGroup = new THREE.Group();
        const cTower = new THREE.Mesh(cornerGeo, ochreMat);
        cTower.position.set(0, 0, 0); cTower.castShadow = true; cTower.receiveShadow = true; cGroup.add(cTower);

        const cCap = new THREE.Mesh(new THREE.BoxGeometry(29.2, 0.8, 29.2), whiteMat);
        cCap.position.set(0, 16.4, 0); cCap.castShadow = true; cGroup.add(cCap);

        // Add 7 Floors of Windows & Vertical White Fin Columns on Front & Rear Corner Towers
        const faceZ = cz > 0 ? 14.08 : -14.08;
        const finZ = cz > 0 ? 14.05 : -14.05;
        for (let floor = 0; floor < 7; floor++) {
          const wy = -12.8 + floor * 4.3;
          for (let wx = -10; wx <= 10; wx += 4.5) {
            const winF = new THREE.Mesh(new THREE.BoxGeometry(2.0, 2.6, 0.1), glassMat);
            winF.position.set(wx, wy, faceZ); cGroup.add(winF);
          }
        }
        [-11, -3.6, 3.6, 11].forEach(colX => {
          const finF = new THREE.Mesh(new THREE.BoxGeometry(0.8, 32.2, 0.6), whiteMat);
          finF.position.set(colX, 0, finZ); finF.castShadow = true; cGroup.add(finF);
        });

        cGroup.position.set(cx, cy, cz);
        scene.add(cGroup);
      });

      // 13. Trees & Landscaping removed per user request

      // Event Listeners
      window.addEventListener('resize', onWindowResize);
      window.addEventListener('pointerdown', onDocumentPointerDown);

      animate();
    }

    // ── Toggle Day / Night Lighting Photorealism ──────────────────────
    function toggleLightingMode() {
      isNightMode = !isNightMode;
      const text = document.getElementById('lighting-text');
      const icon = document.getElementById('lighting-icon');

      if (isNightMode) {
        text.innerText = "Sunset Dusk Mode";
        icon.innerText = "🌙";
        scene.background.setHex(0x1e1b4b);
        scene.fog.color.setHex(0x1e1b4b);
        ambientLight.intensity = 0.25;
        sunLight.intensity = 0.4;
        sunLight.color.setHex(0xf97316);
      } else {
        text.innerText = "Day Sunlight";
        icon.innerText = "☀️";
        scene.background.setHex(0x94cbef);
        scene.fog.color.setHex(0x94cbef);
        ambientLight.intensity = 0.65;
        sunLight.intensity = 1.35;
        sunLight.color.setHex(0xfff7ed);
      }
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    // ── Raycaster Click Detection ─────────────────────────────────────
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    function onDocumentPointerDown(event) {
      if (event.target.closest('.top-bar') || event.target.closest('.wing-modal')) {
        return;
      }

      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(scene.children, true);

      if (intersects.length > 0) {
        let obj = intersects[0].object;
        while (obj.parent && obj.parent !== scene) {
          if (obj.parent === wings.main) { selectWing('main'); return; }
          if (obj.parent === wings.gallery) { selectWing('lounge'); return; }
          if (obj.parent === wings.right) { selectWing('right'); return; }
          if (obj.parent === wings.left) { selectWing('left'); return; }
          obj = obj.parent;
        }
      }
    }

    // ── Wing Selection & Camera Lerp ─────────────────────────────────
    function selectWing(key) {
      const data = wingData[key];
      if (!data) return;

      document.getElementById('modal-title').innerText = data.title;
      document.getElementById('modal-sub').innerText = data.sub;

      const list = document.getElementById('floor-list');
      list.innerHTML = '';
      data.floors.forEach(f => {
        const card = document.createElement('div');
        card.className = 'floor-card';
        card.onclick = () => alert(`Opening ${data.title} — ${f.name}`);
        card.innerHTML = `<span style="font-weight:700;color:#facc15">${f.name}</span><span style="color:#cbd5e1">${f.desc}</span>`;
        list.appendChild(card);
      });

      document.getElementById('wing-modal').style.display = 'block';

      const startT = controls.target.clone();
      const endT = data.pos.clone();
      const startTime = performance.now();

      function step(now) {
        const p = Math.min((now - startTime) / 600, 1);
        const ease = p * (2 - p);
        controls.target.lerpVectors(startT, endT, ease);
        controls.update();
        if (p < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }

    function closeModal() {
      document.getElementById('wing-modal').style.display = 'none';

      const startT = controls.target.clone();
      const endT = new THREE.Vector3(0, 8, 0);
      const startTime = performance.now();

      function step(now) {
        const p = Math.min((now - startTime) / 600, 1);
        const ease = p * (2 - p);
        controls.target.lerpVectors(startT, endT, ease);
        controls.update();
        if (p < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }

    function setFrontView() {
      const startPos = camera.position.clone();
      const endPos = new THREE.Vector3(0, 24, 105);
      const startT = controls.target.clone();
      const endT = new THREE.Vector3(0, 14, 0);
      const startTime = performance.now();

      function step(now) {
        const p = Math.min((now - startTime) / 800, 1);
        const ease = p * (2 - p);
        camera.position.lerpVectors(startPos, endPos, ease);
        controls.target.lerpVectors(startT, endT, ease);
        controls.update();
        if (p < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }

    function setTopView() {
      const startPos = camera.position.clone();
      const endPos = new THREE.Vector3(0, 160, 0.1);
      const startT = controls.target.clone();
      const endT = new THREE.Vector3(0, 0, 0);
      const startTime = performance.now();

      function step(now) {
        const p = Math.min((now - startTime) / 800, 1);
        const ease = p * (2 - p);
        camera.position.lerpVectors(startPos, endPos, ease);
        controls.target.lerpVectors(startT, endT, ease);
        controls.update();
        if (p < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }

    function resetCamera() {
      camera.position.set(75, 55, 85);
      closeModal();
    }

    window.onload = init;
  </script>
</body>
